name: refactorsim-ror-legacy-challenge

services:
  web:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      PORT: "3000"
      RUBY_RUNNER_URL: "http://ruby-runner:4567"
    ports:
      - "3010:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      ruby-runner:
        condition: service_healthy

  ruby-runner:
    build:
      context: ./runner
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit Net::HTTP.get_response(URI('http://127.0.0.1:4567/health')).is_a?(Net::HTTPSuccess) ? 0 : 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  node_modules:
